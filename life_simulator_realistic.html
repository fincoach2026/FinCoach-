<!DOCTYPE html>
<!--
  FinCoach — Life Simulator (3D open-world, realism pass)
  =========================================================
  Same open-world game as before (WASD movement, walk to a place, press E,
  complete the task, values update). This version pushes the *look* as far
  as hand-built Three.js geometry + procedural textures can go: real-time
  shadows, a sky, textured grass/paths, and buildings with roofs, doors,
  and windows instead of plain boxes.

  IMPORTANT — honest ceiling: this still is not photorealistic. Actual
  photorealism needs real 3D models and photo-based textures (a real
  house model, a real character rig), which is exactly why the plan was
  to source assets from Kenney / Sketchfab / Mixamo. Once the team picks
  specific model files, swapping them in here is a straightforward next
  step (load with GLTFLoader instead of building shapes by hand) — just
  ask and I'll wire that up once you have files picked out.

  Django drop-in is unchanged from before: save as a template, render it
  from a plain view, no installs needed (Three.js loads from the CDN tag
  below).

  Controls: WASD / Arrow keys to move, E to interact, Escape to close a
  task panel.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FinCoach — Life Simulator (World)</title>
<style>
  :root {
    --teal: #4DC49B; --dark-green: #488C74; --white: #FFFFFF;
    --deep-green: #21815F; --lime: #9FC35C; --text: #000000;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden;
    background:#000; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--text); }
  #scene-container { position:absolute; inset:0; touch-action:none; }
  #scene-container canvas { touch-action:none; }
  #loading {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#dff2ea; color:var(--deep-green); font-weight:700; font-size:16px; z-index:20;
  }

  #hud {
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    padding:12px 10px;
    background: linear-gradient(180deg, rgba(33,129,95,0.85), rgba(33,129,95,0));
    pointer-events:none;
  }
  .hud-chip {
    background:rgba(255,255,255,0.92); border-radius:10px; padding:6px 12px;
    font-size:12.5px; font-weight:700; color:var(--deep-green);
    display:flex; align-items:center; gap:6px;
  }
  .hud-chip small { font-weight:500; color:#333; }

  #progress-row {
    position:absolute; top:56px; left:0; right:0; z-index:5;
    display:flex; justify-content:center; gap:8px; pointer-events:none;
  }
  .loc-pill {
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:rgba(255,255,255,0.85); color:#333;
  }
  .loc-pill.done { background: var(--lime); color:#113; }

  #interact-prompt {
    position:absolute; left:50%; bottom:26%; transform:translateX(-50%);
    background: var(--deep-green); color:var(--white);
    padding:10px 18px; border-radius:10px; font-weight:700; font-size:14px;
    display:none; z-index:6; box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  #interact-prompt kbd { background:rgba(255,255,255,0.25); padding:2px 7px; border-radius:5px; margin-right:6px; }

  #move-hint {
    position:absolute; left:16px; bottom:16px; z-index:5;
    background:rgba(255,255,255,0.85); border-radius:10px; padding:8px 12px;
    font-size:11.5px; color:#333; line-height:1.5;
  }

  /* ---- Drag-to-move joystick (mouse or touch, anywhere on screen) ---- */
  #joystick-base, #joystick-thumb {
    position:absolute; z-index:7; border-radius:50%;
    pointer-events:none; display:none;
  }
  #joystick-base {
    width:100px; height:100px; margin-left:-50px; margin-top:-50px;
    background:rgba(255,255,255,0.18); border:2px solid rgba(255,255,255,0.6);
  }
  #joystick-thumb {
    width:44px; height:44px; margin-left:-22px; margin-top:-22px;
    background:rgba(255,255,255,0.55); border:2px solid rgba(255,255,255,0.85);
  }

  #overlay {
    position:absolute; inset:0; background:rgba(0,0,0,0.35);
    display:none; align-items:flex-end; justify-content:center; z-index:10;
  }
  #panel {
    width:100%; max-width:720px; max-height:78vh; overflow-y:auto;
    background:var(--white); border-radius:18px 18px 0 0;
    border-top:4px solid var(--deep-green);
    box-shadow:0 -8px 24px rgba(0,0,0,0.25);
    padding:20px 24px 24px;
  }
  #panel h2 { margin:0 0 4px; font-size:20px; color:var(--deep-green); }
  #panel .sub { margin:0 0 14px; font-size:13px; color:#444; }
  .field-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
  .field { flex:1 1 180px; min-width:150px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:4px; color:#333; }
  .field input[type=text], .field input[type=number], .field select {
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid #ccc; font-size:14px;
  }
  .field input[type=range] { width:100%; }
  .toggle-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .btn-row { display:flex; justify-content:space-between; margin-top:14px; gap:10px; }
  button.fc-btn {
    background:var(--teal); color:var(--white); border:none; border-radius:8px;
    padding:10px 18px; font-weight:700; font-size:14px; cursor:pointer;
  }
  button.fc-btn:hover { background:var(--deep-green); }
  button.fc-btn.secondary { background:#eee; color:#333; }
  .fc-card { background:rgba(77,196,155,0.15); border-left:6px solid var(--deep-green);
    border-radius:8px; padding:12px 16px; margin:10px 0; font-size:13px; }
  .metrics { display:flex; gap:12px; flex-wrap:wrap; margin:10px 0; }
  .metric { flex:1 1 140px; background:rgba(159,195,92,0.25); border-radius:10px; padding:10px; }
  .metric .label { font-size:11px; color:#333; }
  .metric .value { font-size:18px; font-weight:800; color:var(--deep-green); }
  canvas#chart { width:100%; max-width:640px; height:220px; display:block; margin-top:8px; }
  .legend { display:flex; gap:16px; font-size:12px; margin-top:4px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .swatch { width:10px; height:10px; border-radius:2px; display:inline-block; }

  /* ---- Character select screen ---- */
  #character-select {
    position:absolute; inset:0; z-index:15;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.10), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 2px, transparent 2px, transparent 26px),
      linear-gradient(135deg, #123b2b 0%, #21815F 40%, #488C74 72%, #4DC49B 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--white); text-align:center; padding:20px;
  }
  #character-select .brand-chip {
    display:inline-block; padding:5px 14px; border-radius:999px;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3);
    font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    margin-bottom:14px; color:var(--lime);
  }
  #character-select h1 {
    margin:0 0 6px; font-size:30px; font-weight:800; letter-spacing:0.3px;
    text-shadow:0 2px 10px rgba(0,0,0,0.25);
  }
  #character-select p { margin:0 0 26px; font-size:14px; opacity:0.9; }
  #character-grid { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; max-width:900px; }
  .char-card {
    background:rgba(255,255,255,0.12); border:2px solid transparent;
    border-radius:16px; padding:14px; width:150px; cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
    backdrop-filter:blur(6px);
    transition:transform 0.15s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .char-card:hover {
    transform:translateY(-6px);
    background:rgba(255,255,255,0.22);
    border-color:#fff;
    box-shadow:0 14px 32px rgba(0,0,0,0.28);
  }
  .char-card img { width:100%; height:130px; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.25)); }
  .char-card .char-name { margin-top:8px; font-weight:700; font-size:14px; }
</style>
</head>
<body>

<div id="scene-container"></div>
<div id="loading">Loading the world…</div>
<div id="hud"></div>
<div id="progress-row"></div>
<div id="interact-prompt"><kbd>E</kbd><span id="prompt-text">Enter</span></div>
<div id="move-hint">Drag anywhere to move (mouse or finger)<br>E / tap the prompt to enter a place · Esc to leave</div>
<div id="joystick-base"></div>
<div id="joystick-thumb"></div>

<div id="overlay"><div id="panel"></div></div>

<div id="character-select">
  <span class="brand-chip">💰 FinCoach</span>
  <h1>Choose your character</h1>
  <p>Pick who you'll play as. Everyone else in the family will still be at Home.</p>
  <div id="character-grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script>
// =========================================================
// FINANCIAL DATA (unchanged from earlier versions)
// =========================================================
const data = {
  name: "", age: 20, has_family: "No",
  housing_type: "Rent", housing_cost: 1200,
  groceries: 400, utilities: 250, other_expenses: 200,
  education_level: "College", has_loan: "No", loan_amount: 0, loan_payment: 0,
  employment_status: "Full-time", job_title: "Retail Associate",
  monthly_income: 3000, retirement_pct: 5,
  has_side_hustle: false, side_hustle_income: 300,
  savings: 1000, emergency_fund: 500,
  credit_card_debt: 0, credit_card_payment: 0,
  investment_amount: 0, investment_return_pct: 7,
  emergency_expense: 0, emergency_expense_year: 2,
};
const completed = { home: false, school: false, company: false, bank: false };

// =========================================================
// PROCEDURAL TEXTURES
// Built with canvas so the whole file works standalone with
// no image downloads — just patterns and noise, tiled with
// THREE.RepeatWrapping so they read as real materials instead
// of flat colors.
// =========================================================
function makeCanvasTexture(size, painter, repeatX = 1, repeatY = 1) {
  const cnv = document.createElement("canvas");
  cnv.width = size; cnv.height = size;
  const ctx = cnv.getContext("2d");
  painter(ctx, size);
  const tex = new THREE.CanvasTexture(cnv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  tex.anisotropy = 4;
  return tex;
}

const grassTexture = makeCanvasTexture(256, (ctx, s) => {
  ctx.fillStyle = "#8fc478";
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 2200; i++) {
    const x = Math.random() * s, y = Math.random() * s;
    const shade = Math.random() > 0.5 ? "#7fb968" : "#9dd08a";
    ctx.fillStyle = shade;
    ctx.fillRect(x, y, 2, 2);
  }
}, 18, 18);

const pathTexture = makeCanvasTexture(128, (ctx, s) => {
  ctx.fillStyle = "#c9c2b3";
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 60; i++) {
    ctx.fillStyle = `rgba(${140 + Math.random()*40},${135 + Math.random()*40},${120 + Math.random()*30},0.5)`;
    const w = 8 + Math.random() * 14, h = 8 + Math.random() * 14;
    ctx.fillRect(Math.random() * s, Math.random() * s, w, h);
  }
}, 6, 2);

function makeSidingTexture(hex, rows = 10) {
  return makeCanvasTexture(256, (ctx, s) => {
    ctx.fillStyle = hex;
    ctx.fillRect(0, 0, s, s);
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 2;
    const rowH = s / rows;
    for (let r = 0; r <= rows; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * rowH);
      ctx.lineTo(s, r * rowH);
      ctx.stroke();
    }
    // subtle vertical noise for texture
    for (let i = 0; i < 400; i++) {
      ctx.fillStyle = "rgba(255,255,255,0.04)";
      ctx.fillRect(Math.random() * s, Math.random() * s, 1, 6);
    }
  }, 2, 3);
}

const roofTexture = makeCanvasTexture(128, (ctx, s) => {
  ctx.fillStyle = "#3a3a3a";
  ctx.fillRect(0, 0, s, s);
  for (let r = 0; r < 16; r++) {
    ctx.fillStyle = r % 2 === 0 ? "#333333" : "#404040";
    ctx.fillRect(0, r * (s / 16), s, s / 16 - 1);
  }
}, 3, 3);

const skyTexture = makeCanvasTexture(512, (ctx, s) => {
  const g = ctx.createLinearGradient(0, 0, 0, s);
  g.addColorStop(0, "#6fb1e6");
  g.addColorStop(0.55, "#bfe3f0");
  g.addColorStop(1, "#eaf7ee");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  // a few soft clouds
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  for (let i = 0; i < 10; i++) {
    const cx = Math.random() * s, cy = Math.random() * s * 0.5;
    for (let j = 0; j < 5; j++) {
      ctx.beginPath();
      ctx.ellipse(cx + j * 18, cy, 22, 13, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
});

// Simplified brick pattern (offset rows, not individually sculpted
// bricks — a real photoreal brick texture would need a photographed
// or hand-painted source image, not canvas code).
function makeBrickTexture(hex) {
  return makeCanvasTexture(256, (ctx, s) => {
    ctx.fillStyle = "#8a8378";
    ctx.fillRect(0, 0, s, s);
    const rows = 12, rowH = s / rows;
    for (let r = 0; r < rows; r++) {
      const offset = (r % 2) * 24;
      ctx.fillStyle = hex;
      for (let x = -32; x < s + 32; x += 48) {
        ctx.fillRect(x + offset, r * rowH, 44, rowH - 4);
      }
    }
  }, 2, 2);
}

// Office-tower glass: a grid of blue-tinted window panes on a
// dark metal frame.
function makeGlassTexture() {
  return makeCanvasTexture(256, (ctx, s) => {
    ctx.fillStyle = "#1c2733";
    ctx.fillRect(0, 0, s, s);
    const cols = 5, rows = 8, pad = 6;
    const cw = s / cols, rh = s / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const g = ctx.createLinearGradient(0, r * rh, 0, (r + 1) * rh);
        g.addColorStop(0, "rgba(190,225,245,0.9)");
        g.addColorStop(1, "rgba(120,165,195,0.9)");
        ctx.fillStyle = g;
        ctx.fillRect(c * cw + pad, r * rh + pad, cw - pad * 2, rh - pad * 2);
      }
    }
  }, 1, 3);
}

// Dark asphalt with a dashed center line.
const roadTexture = makeCanvasTexture(256, (ctx, s) => {
  ctx.fillStyle = "#3a3d40";
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 500; i++) {
    ctx.fillStyle = `rgba(0,0,0,${0.05 + Math.random() * 0.08})`;
    ctx.fillRect(Math.random() * s, Math.random() * s, 2, 2);
  }
  ctx.fillStyle = "#e8c94a";
  const dashW = 26, gap = 20, y0 = s / 2 - 4;
  for (let x = 0; x < s; x += dashW + gap) {
    ctx.fillRect(x, y0, dashW, 8);
  }
}, 10, 1);

// Green/white striped awning fabric.
const awningTexture = makeCanvasTexture(64, (ctx, s) => {
  const stripeW = s / 6;
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 === 0 ? "#2d6e46" : "#f2efe6";
    ctx.fillRect(i * stripeW, 0, stripeW, s);
  }
}, 6, 1);

// =========================================================
// WORLD SETUP
// =========================================================
const LOCATIONS = [
  { key: "home",    name: "🏠 Home",    x: -32, z: 0, color: "#4DC49B", task: "Set your budget" },
  { key: "company", name: "🏢 Company", x: -16, z: 0, color: "#2b3138", task: "Take the job" },
  { key: "school",  name: "🎓 School",  x:   0, z: 0, color: "#9c3b30", task: "Choose your path" },
  { key: "bank",    name: "🏦 Bank",    x:  16, z: 0, color: "#d8cfae", task: "Manage your money" },
];
// Store is scenery only (matches the reference street), not an
// interactive place — walking up to it doesn't do anything.
const STORE = { x: 32, z: 0 };
const PORTAL = { key: "future", name: "🔮 Future Vision", x: 0, z: -18, color: 0xE7B93A, task: "See your future" };
const INTERACT_RADIUS = 5;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById("scene-container").appendChild(renderer.domElement);

// Sky dome
const skyGeo = new THREE.SphereGeometry(220, 32, 32);
const skyMat = new THREE.MeshBasicMaterial({ map: skyTexture, side: THREE.BackSide, fog: false });
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);
scene.fog = new THREE.Fog(0xcfe9de, 55, 160);

// Distant city skyline silhouette, like the reference image's
// background skyscrapers — simple flat-shaded boxes far away,
// not meant to be walked to.
function addSkyline() {
  const mat = new THREE.MeshBasicMaterial({ color: 0x8fa6b8, transparent: true, opacity: 0.55, fog: true });
  for (let i = 0; i < 22; i++) {
    const angle = (i / 22) * Math.PI * 2;
    const dist = 95 + Math.random() * 20;
    const w = 6 + Math.random() * 8, h = 18 + Math.random() * 40;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat);
    box.position.set(Math.cos(angle) * dist, h / 2, Math.sin(angle) * dist);
    scene.add(box);
  }
}
addSkyline();

// Lighting: hemisphere for soft sky/ground bounce + directional "sun" for shadows
const hemi = new THREE.HemisphereLight(0xbfe3f0, 0x8fc478, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3d6, 1.05);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0015;
scene.add(sun);

// Ground
const groundGeo = new THREE.PlaneGeometry(130, 90);
const groundMat = new THREE.MeshStandardMaterial({ map: grassTexture, roughness: 1, metalness: 0 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Street: sidewalk in front of the buildings, then the road,
// with a crosswalk in front of School and a couple of streetlights
// and parked cars for atmosphere — echoing the reference image's
// single street lined with buildings.
const STREET_SPAN = 100;
const sidewalkMat = new THREE.MeshStandardMaterial({ map: pathTexture, roughness: 0.95 });
const sidewalk = new THREE.Mesh(new THREE.PlaneGeometry(STREET_SPAN, 5), sidewalkMat);
sidewalk.rotation.x = -Math.PI / 2;
sidewalk.position.set(0, 0.02, 7);
sidewalk.receiveShadow = true;
scene.add(sidewalk);

const roadMat = new THREE.MeshStandardMaterial({ map: roadTexture, roughness: 0.85 });
const road = new THREE.Mesh(new THREE.PlaneGeometry(STREET_SPAN, 8), roadMat);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.01, 13);
road.receiveShadow = true;
scene.add(road);

// Crosswalk stripes, centered in front of School (x = 0)
const crosswalkMat = new THREE.MeshStandardMaterial({ color: 0xf2efe6, roughness: 0.9 });
for (let i = -3; i <= 3; i++) {
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.03, 7), crosswalkMat);
  stripe.position.set(i * 2.1, 0.03, 13);
  stripe.receiveShadow = true;
  scene.add(stripe);
}

function addStreetlight(x, z) {
  const group = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.09, 0.09, 5, 8),
    new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.6 })
  );
  pole.position.y = 2.5;
  pole.castShadow = true;
  group.add(pole);
  const lamp = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0xfff3c4, emissive: 0xfff3c4, emissiveIntensity: 0.6 })
  );
  lamp.position.y = 5.1;
  group.add(lamp);
  group.position.set(x, 0, z);
  scene.add(group);
}
[-40, -24, -8, 8, 24, 40].forEach(x => addStreetlight(x, 9.5));

function addParkedCar(x, z, bodyColor) {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.4, metalness: 0.3 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x2a3540, roughness: 0.2, metalness: 0.5 });
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.9, 1.8), bodyMat);
  body.position.y = 0.55;
  body.castShadow = true;
  group.add(body);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.7, 1.6), glassMat);
  cabin.position.set(-0.2, 1.25, 0);
  cabin.castShadow = true;
  group.add(cabin);

  const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
  [[-1.4, 0.95], [-1.4, -0.95], [1.4, 0.95], [1.4, -0.95]].forEach(([wx, wz]) => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(wx, 0.35, wz);
    group.add(wheel);
  });

  group.position.set(x, 0, z);
  scene.add(group);
}

// Each place is a small "house": walls with a siding texture,
// a shingled roof, a door, and glowing windows — instead of a
// single flat-colored box.

function makeLabelSprite(text) {
  const cnv = document.createElement("canvas");
  cnv.width = 320; cnv.height = 76;
  const ctx = cnv.getContext("2d");
  ctx.fillStyle = "rgba(33,129,95,0.95)";
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(0, 0, 320, 76, 20); ctx.fill(); }
  else ctx.fillRect(0, 0, 320, 76);
  ctx.font = "bold 34px sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 160, 38);
  const tex = new THREE.CanvasTexture(cnv);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sprite.scale.set(4.2, 1, 1);
  return sprite;
}

// A fixed-orientation (non-billboard) sign texture, for text
// mounted directly on a building facade — e.g. "FinCoach" on
// the office tower, unlike the floating task-prompt labels
// which always face the camera.
function makeSignTexture(text, w, h, bg, fg) {
  const cnv = document.createElement("canvas");
  cnv.width = w; cnv.height = h;
  const ctx = cnv.getContext("2d");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = fg;
  ctx.font = `bold ${Math.floor(h * 0.42)}px sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, w / 2, h / 2);
  return new THREE.CanvasTexture(cnv);
}

// Shared floating task-prompt label + "done" badge, used by
// every building type so the game logic stays identical no
// matter how each building looks.
function attachSignage(group, loc, badgeHeight) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.2, 8),
    new THREE.MeshStandardMaterial({ color: 0x5a3a24 }));
  post.position.set(0, 1.1, 3.8);

  group.add(post);

  const label = makeLabelSprite(loc.name);
  label.position.set(0, 2.6, 3.8);
  group.add(label);

  const badge = makeLabelSprite("✓ Done");
  badge.position.set(0, badgeHeight, 0);
  badge.visible = false;
  group.add(badge);
  loc.badgeSprite = badge;
}

// CHARACTER
// Uses the actual character artwork, embedded directly in this
// file as base64 data (see the CHARACTERS array below) instead
// of separate image files. This means the file is fully
// self-contained — no "characters" folder to keep track of,
// no broken paths, no dead links. The tradeoff is a larger
// file size, which is fine for a prototype like this.
// =========================================================
const textureLoader = new THREE.TextureLoader();
textureLoader.setCrossOrigin("anonymous");

// How high off the ground characters hover, to sell the
// "floating avatar" look instead of feet-on-the-ground.
const FLOAT_HEIGHT = 0.9;

// A soft blurred ellipse used as a ground shadow under each
// floating character, so they still read as being "in" the
// world instead of just pasted on top of it.
const shadowTexture = makeCanvasTexture(64, (ctx, s) => {
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, "rgba(0,0,0,0.32)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
});
function makeFloatShadow(width) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(width, width * 0.45),
    new THREE.MeshBasicMaterial({ map: shadowTexture, transparent: true, depthWrite: false })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = 0.03;
  scene.add(mesh);
  return mesh;
}

let characterBaseY = 1.1;
let characterShadowBase = 1.0;
const characterMat = new THREE.SpriteMaterial({ transparent: true });
const character = new THREE.Sprite(characterMat);
character.position.set(0, characterBaseY, 8);
scene.add(character);
const characterShadow = makeFloatShadow(1.6);

function loadCharacterSprite(url, height) {
  textureLoader.load(url, (tex) => {
    tex.minFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    characterMat.map = tex;
    characterMat.needsUpdate = true;
    const w = height * (tex.image.width / tex.image.height);
    character.scale.set(w, height, 1);
    characterBaseY = height / 2 + FLOAT_HEIGHT;
    character.position.y = characterBaseY;
    characterShadowBase = w * 0.6;
    characterShadow.scale.set(characterShadowBase, characterShadowBase * 0.45, 1);
  });
}

// Family NPCs standing near Home — same art sheet, just for
// atmosphere; they don't do anything when walked into. Whoever
// the player picked is skipped so you don't see yourself twice.
const NPC_OFFSETS = [[3.6, 1.4], [4.9, 1.4], [3.6, 3.0], [4.9, 3.0]];
const idleFloaters = []; // NPC sprites that gently bob in place
// =========================================================
// 3D BODY MODELS
// A real (non-sprite) low-poly body per character, built from
// primitives and colored to roughly match their outfit in the
// reference art. These are what the player actually walks
// around as once movement starts — see the swap logic in
// animate(). Honest limitation: these are simple colored
// shapes, not sculpted/rigged models — a true match to the
// reference art needs an actual 3D artist or an image-to-3D
// tool (Meshy AI, Tripo AI, etc.), then loading the resulting
// .glb with THREE.GLTFLoader instead of this function.
// =========================================================
const CHARACTER_COLORS = {
  dad:      { shirt: 0x2f4d86, bottom: 0x24314a, skin: 0xF2C29B, hair: 0x1c1c1c },
  mom:      { shirt: 0xD9A62E, bottom: 0x3a2f28, skin: 0xF2C29B, hair: 0x1c1c1c },
  son:      { shirt: 0x3f7d4a, bottom: 0x2b2b33, skin: 0xF2C29B, hair: 0x1c1c1c },
  daughter: { shirt: 0xf2efe6, bottom: 0x1e3a6b, skin: 0xF2C29B, hair: 0x1c1c1c },
  baby:     { shirt: 0xEAD9A0, bottom: 0xEAD9A0, skin: 0xF6D2A8, hair: 0x2a2118 },
};

// Character model paths for real .glb models
const CHARACTER_MODELS = {
  baby:     "/static/characters/Baby.glb",
  daughter: "/static/characters/Daughter.glb",
  mom:      "/static/characters/Mom.glb",
  dad:      "/static/characters/Dad.glb",
  son:      "/static/characters/Son.glb",
};

function buildBodyGroup(key) {
  const group = new THREE.Group();
  group.visible = false;
  scene.add(group);
  return group;
}

const gltfLoader = new THREE.GLTFLoader();

function loadCharacterModel(key, targetGroup, onSuccess) {
  const modelPath = CHARACTER_MODELS[key] || CHARACTER_MODELS.son;
  gltfLoader.load(
    modelPath,
    (gltf) => {
      const model = gltf.scene;
      model.scale.setScalar(1.5);
      model.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      targetGroup.clear();
      targetGroup.add(model);
      targetGroup.userData.model = model;
      targetGroup.userData.modelLoaded = true;
      targetGroup.visible = true;
      if (onSuccess) onSuccess();
    },
    undefined,
    (err) => {
      console.warn(`Failed to load character model for ${key}:`, err);
      targetGroup.userData.modelLoaded = false;
    }
  );
}

let characterBody = null;
let hasStartedMoving = false;

function placeFamilyNPCs(excludeKey) {
  const homeLoc = LOCATIONS.find(l => l.key === "home");
  const npcs = CHARACTERS.filter(c => c.key !== excludeKey);
  npcs.forEach((c, i) => {
    const [offsetX, offsetZ] = NPC_OFFSETS[i];
    const baseX = homeLoc.x + offsetX, baseZ = homeLoc.z + offsetZ;
    const shadow = makeFloatShadow(c.height * 0.75);
    shadow.position.set(baseX, 0.03, baseZ);

    // Try to load real .glb model
    const npcGroup = new THREE.Group();
    npcGroup.position.set(baseX, 0, baseZ);
    npcGroup.userData.isNPC = true;
    scene.add(npcGroup);

    // Also create sprite fallback
    const mat = new THREE.SpriteMaterial({ transparent: true });
    const sprite = new THREE.Sprite(mat);
    sprite.position.set(baseX, c.height / 2 + FLOAT_HEIGHT, baseZ);
    scene.add(sprite);
    
    const phase = Math.random() * Math.PI * 2;
    
    // Load texture and set up sprite
    textureLoader.load(c.file, (tex) => {
      tex.minFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      mat.map = tex;
      mat.needsUpdate = true;
      const w = c.height * (tex.image.width / tex.image.height);
      sprite.scale.set(w, c.height, 1);
      sprite.position.y = c.height / 2 + FLOAT_HEIGHT;
      shadow.scale.set(w * 0.65, w * 0.65, 1);
    });

    // Try to load .glb model, hide sprite if successful
    loadCharacterModel(c.key, npcGroup, () => {
      sprite.visible = false;
    });

    idleFloaters.push({ sprite, npcGroup, baseY: c.height / 2 + FLOAT_HEIGHT, phase });
  });
}

// =========================================================
// CHARACTER SELECT SCREEN
// Shown before the world starts. Picking a character loads
// that art onto the player sprite, places everyone else as
// Home NPCs, then starts the game loop.
// =========================================================
function renderCharacterSelect() {
  const grid = document.getElementById("character-grid");
  grid.innerHTML = CHARACTERS.map(c => `
    <div class="char-card" onclick="startGame('${c.key}')">
      <img src="${c.file}" alt="${c.name}">
      <div class="char-name">${c.name}</div>
    </div>
  `).join("");
}

function startGame(key) {
  const chosen = CHARACTERS.find(c => c.key === key);
  loadCharacterSprite(chosen.file, chosen.height);
  placeFamilyNPCs(key);
  loadPlayerModel(key);
  document.getElementById("character-select").style.display = "none";
  animate();
}

let facing = 0;

// Movement state — keyboard AND drag (mouse or touch) both work
// and can be mixed freely; whichever the player is using "wins"
// for that frame.
const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "e") tryInteract();
  if (e.key === "Escape") closePanel();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

// Drag-to-move: press/tap anywhere on the 3D view and drag — the
// further from the starting point, the faster that direction moves.
// Works identically for mouse and touch since Pointer Events unify
// both. A visible joystick appears under the finger/cursor while
// dragging so it's clear what's happening, especially on phones.
const JOYSTICK_RADIUS = 55;
let pointerActive = false;
let pointerDX = 0, pointerDY = 0;
const joystickBase = document.getElementById("joystick-base");
const joystickThumb = document.getElementById("joystick-thumb");
let pointerStartX = 0, pointerStartY = 0;

function onPointerDown(e) {
  if (panelOpen) return;
  pointerActive = true;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  pointerDX = 0; pointerDY = 0;
  joystickBase.style.left = pointerStartX + "px";
  joystickBase.style.top = pointerStartY + "px";
  joystickThumb.style.left = pointerStartX + "px";
  joystickThumb.style.top = pointerStartY + "px";
  joystickBase.style.display = "block";
  joystickThumb.style.display = "block";
  renderer.domElement.setPointerCapture(e.pointerId);
}
function onPointerMove(e) {
  if (!pointerActive) return;
  let dx = e.clientX - pointerStartX;
  let dy = e.clientY - pointerStartY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > JOYSTICK_RADIUS) {
    dx = (dx / dist) * JOYSTICK_RADIUS;
    dy = (dy / dist) * JOYSTICK_RADIUS;
  }
  pointerDX = dx; pointerDY = dy;
  joystickThumb.style.left = (pointerStartX + dx) + "px";
  joystickThumb.style.top = (pointerStartY + dy) + "px";
}
function endPointer() {
  pointerActive = false;
  pointerDX = 0; pointerDY = 0;
  joystickBase.style.display = "none";
  joystickThumb.style.display = "none";
}

let panelOpen = false;
const clock = new THREE.Clock();
const WORLD_MIN_X = -46, WORLD_MAX_X = 46;
const WORLD_MIN_Z = -24, WORLD_MAX_Z = 16;
const SPEED = 9;

// =========================================================
// PLAYER 3D MODEL
// The walking avatar now uses the same selected character's
// low-poly body so the on-screen person matches the choice made
// on the character-select screen and animates with their own
// silhouette instead of the old yellow robot placeholder.
// =========================================================
let playerModel = null;

function loadPlayerModel(key) {
  if (playerModel) {
    playerModel.visible = true;
    playerModel.userData.characterKey = key;
    return;
  }

  playerModel = buildBodyGroup(key);
  playerModel.scale.setScalar(1.0);
  playerModel.position.set(0, 0, 8);
  playerModel.userData.characterKey = key;
  playerModel.userData.walkCycle = 0;

  // Keep sprite visible as fallback while model loads
  character.visible = true;
  characterShadow.visible = true;

  // Load the real model, and hide sprite only on success
  loadCharacterModel(key, playerModel, () => {
    character.visible = false;
    characterShadow.visible = false;
  });
}

function nearestPlace() {
  let best = null, bestDist = Infinity;
  ALL_PLACES.forEach((loc) => {
    const dx = character.position.x - loc.x, dz = character.position.z - loc.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < bestDist) { bestDist = dist; best = loc; }
  });
  return { loc: best, dist: bestDist };
}
function tryInteract() {
  if (panelOpen) return;
  const { loc, dist } = nearestPlace();
  if (dist <= INTERACT_RADIUS) openPanel(loc.key);
}
function updateInteractPrompt() {
  const promptEl = document.getElementById("interact-prompt");
  if (panelOpen) { promptEl.style.display = "none"; return; }
  const { loc, dist } = nearestPlace();
  if (dist <= INTERACT_RADIUS) {
    document.getElementById("prompt-text").textContent = `${loc.task} (${loc.name.replace(/^\S+\s/, "")})`;
    promptEl.style.display = "block";
  } else {
    promptEl.style.display = "none";
  }
}
// Tapping/clicking the prompt itself also interacts — handy on
// phones where there's no "E" key.
document.getElementById("interact-prompt").addEventListener("click", tryInteract);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // With a fixed (non-rotating) camera, this mapping is always the
  // same no matter which way the character currently faces — drag
  // up always moves deeper into the screen, drag right always moves
  // right on screen. Nothing here depends on `facing`, so there is
  // no feedback loop left to cause spinning-in-place.
  let moveX = 0, moveZ = 0, isWalking = false;
  if (!panelOpen) {
    if (keys["w"] || keys["arrowup"]) moveZ -= 1;
    if (keys["s"] || keys["arrowdown"]) moveZ += 1;
    if (keys["a"] || keys["arrowleft"]) moveX -= 1;
    if (keys["d"] || keys["arrowright"]) moveX += 1;

    if (pointerActive && (Math.abs(pointerDX) > 6 || Math.abs(pointerDY) > 6)) {
      moveX = pointerDX / JOYSTICK_RADIUS;
      moveZ = pointerDY / JOYSTICK_RADIUS;
    }
  }

  if (moveX !== 0 || moveZ !== 0) {
    isWalking = true;
    const rawMag = Math.sqrt(moveX * moveX + moveZ * moveZ);
    const normX = moveX / rawMag, normZ = moveZ / rawMag;
    // Drag distance still scales speed a bit (soft joystick feel);
    // keyboard always moves at full speed.
    const magnitude = pointerActive ? Math.min(rawMag, 1) : 1;
    character.position.x = Math.max(WORLD_MIN_X, Math.min(WORLD_MAX_X, character.position.x + normX * SPEED * magnitude * dt));
    character.position.z = Math.max(WORLD_MIN_Z, Math.min(WORLD_MAX_Z, character.position.z + normZ * SPEED * magnitude * dt));
    facing = Math.atan2(normX, normZ);
    character.rotation.y = facing;
  }

  const t = performance.now() * 0.006;
  const idleFloat = Math.sin(performance.now() * 0.0018) * 0.14;
  const walkBob = isWalking ? Math.abs(Math.sin(t * 8)) * 0.08 : 0;
  character.position.y = characterBaseY + idleFloat + walkBob;

  // Shadow stays on the ground under the character and shrinks a
  // touch as the character rises, to sell the floating height.
  characterShadow.position.x = character.position.x;
  characterShadow.position.z = character.position.z;
  const shadowPulse = 1 - (idleFloat + walkBob) * 0.25;
  characterShadow.scale.set(characterShadowBase * shadowPulse, characterShadowBase * 0.45 * shadowPulse, 1);

  // Gentle idle bob for the family NPCs standing at Home
  idleFloaters.forEach((f) => {
    const bob = Math.sin(performance.now() * 0.0015 + f.phase) * 0.12;
    if (f.sprite && f.sprite.isSprite) {
      f.sprite.position.y = f.baseY + bob;
    }
    if (f.npcGroup) {
      f.npcGroup.position.y = bob * 0.5;
    }
  });

  ring.rotation.z += dt * 0.5;

  // Keep the selected character's body glued to the same
  // logical position/facing as the tracked `character`.
  if (playerModel) {
    playerModel.position.set(character.position.x, 0, character.position.z);
    playerModel.rotation.y = facing;

    const walkCycle = isWalking ? performance.now() * 0.01 : playerModel.userData.walkCycle;
    const bob = isWalking ? Math.abs(Math.sin(walkCycle * 2.2)) * 0.06 : Math.sin(performance.now() * 0.0024) * 0.03;
    playerModel.position.y = bob;

    playerModel.userData.walkCycle = walkCycle;
  }

  // Fixed-angle camera: it FOLLOWS the character's position but never
  // rotates to match their facing. This is the actual fix — with a
  // rotating chase camera, "drag direction" and "camera facing" were
  // feeding into each other every frame, which is what caused the
  // spin-in-place bug. With a fixed angle, drag-to-world mapping never
  // changes no matter which way the character is currently facing.
  const camOffset = new THREE.Vector3(0, 6.5, 10);
  const desiredCamPos = character.position.clone().add(camOffset);
  camera.position.lerp(desiredCamPos, 0.1);
  camera.lookAt(character.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

  updateInteractPrompt();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// =========================================================
// PROJECTION MATH (same as previous versions)
// =========================================================
function runProjection(years) {
  let income = data.monthly_income + (data.has_side_hustle ? data.side_hustle_income : 0);
  const housing = data.housing_cost, groceries = data.groceries,
        utilities = data.utilities, other = data.other_expenses,
        loanPayment = data.loan_payment, ccPayment = data.credit_card_payment;
  const retirementPct = data.retirement_pct / 100;

  let monthlyCosts = housing + groceries + utilities + other + loanPayment + ccPayment;
  let retirementContribution = income * retirementPct;
  let leftover = income - monthlyCosts - retirementContribution;

  let savings = data.savings;
  let emergency = data.emergency_fund;
  let debt = data.loan_amount + data.credit_card_debt;
  let retirementBalance = 0;
  let investmentBalance = data.investment_amount;
  const investmentReturn = data.investment_return_pct / 100;
  const emergencyExpense = data.emergency_expense;
  const emergencyYear = data.emergency_expense_year;
  let emergencyNote = null;

  const yearlySavings = [savings];
  const yearlyDebt = [debt];
  const yearlyNetWorth = [savings + emergency + investmentBalance - debt];

  for (let year = 1; year <= years; year++) {
    income *= 1.03;
    const monthlyCostsGrowth = monthlyCosts * 1.02;
    retirementContribution = income * retirementPct;
    leftover = Math.max(income - monthlyCostsGrowth - retirementContribution, 0);

    savings += leftover * 12;
    retirementBalance = (retirementBalance + retirementContribution * 12) * 1.06;
    investmentBalance *= (1 + investmentReturn);
    debt = Math.max(debt - (loanPayment + ccPayment) * 12, 0);

    if (emergencyExpense > 0 && year === emergencyYear) {
      let remaining = emergencyExpense;
      const fromSavings = Math.min(savings, remaining);
      savings -= fromSavings; remaining -= fromSavings;
      if (remaining > 0) {
        const fromEmergency = Math.min(emergency, remaining);
        emergency -= fromEmergency; remaining -= fromEmergency;
      }
      if (remaining > 0) {
        debt += remaining;
        emergencyNote = `In year ${year}, a $${emergencyExpense.toLocaleString()} surprise expense wasn't fully covered by savings and the emergency fund, so the rest was added to debt.`;
      } else {
        emergencyNote = `In year ${year}, a $${emergencyExpense.toLocaleString()} surprise expense was fully covered by savings and the emergency fund — no new debt needed.`;
      }
    }

    yearlySavings.push(savings);
    yearlyDebt.push(debt);
    yearlyNetWorth.push(savings + emergency + retirementBalance + investmentBalance - debt);
  }
  return { leftover, yearlySavings, yearlyDebt, yearlyNetWorth, emergencyNote, investmentBalance };
}

function drawChart(canvas, years, netWorth, savings, debt) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width = canvas.clientWidth * 2;
  const h = canvas.height = canvas.clientHeight * 2;
  ctx.clearRect(0, 0, w, h);
  const all = [...netWorth, ...savings, ...debt];
  const max = Math.max(...all, 1), min = Math.min(...all, 0), pad = 30;
  function plot(series, color) {
    ctx.beginPath();
    series.forEach((v, i) => {
      const x = pad + (i / years) * (w - pad * 2);
      const y = h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.stroke();
  }
  plot(netWorth, "#21815F"); plot(savings, "#4DC49B"); plot(debt, "#B0472F");
}

function renderFutureTask(years) {
  years = years || 5;
  const result = runProjection(years);

  if (result.leftover < 0) {
    takeaway = "⚠️ Right now your monthly costs are higher than your income. That means debt or savings will shrink over time unless income goes up or costs come down.";
  } else if (result.leftover < 100) {
    takeaway = "🟡 You are breaking even most months. Even a small emergency could be tough to cover. Building up that emergency fund should be a top priority.";
  } else {
    takeaway = "✅ You have positive cash flow every month. Keep automating savings and paying down debt, and your net worth should keep climbing.";
  }
  panel.innerHTML = `
    <h2>🔮 Future Vision</h2>
    <p class="sub">A live look at where your current choices are headed. Come back after adjusting things at other places.</p>
    <div class="field-row">

      <div class="metric"><div class="label">Savings in ${years} yrs</div><div class="value">$${result.yearlySavings.at(-1).toLocaleString(undefined,{maximumFractionDigits:0})}</div></div>
      <div class="metric"><div class="label">Debt in ${years} yrs</div><div class="value">$${result.yearlyDebt.at(-1).toLocaleString(undefined,{maximumFractionDigits:0})}</div></div>
    </div>
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><span class="swatch" style="background:#21815F"></span>Net worth</span>
      <span><span class="swatch" style="background:#4DC49B"></span>Savings</span>
      <span><span class="swatch" style="background:#B0472F"></span>Debt</span>
    </div>
    <div class="fc-card">${takeaway}</div>
    ${result.emergencyNote ? `<div class="fc-card">🚨 ${result.emergencyNote}</div>` : ""}
    ${data.investment_amount > 0 ? `<div class="fc-card">📈 The $${data.investment_amount.toLocaleString()} you invested grew to about $${result.investmentBalance.toLocaleString(undefined,{maximumFractionDigits:0})} over ${years} years.</div>` : ""}

      <button class="fc-btn secondary" onclick="closePanel()">Back to the world</button>
      <span></span>
    </div>
  `;
  drawChart(document.getElementById("chart"), years, result.yearlyNetWorth, result.yearlySavings, result.yearlyDebt);
  document.getElementById("f_years").addEventListener("input", (e) => renderFutureTask(Number(e.target.value)));
}

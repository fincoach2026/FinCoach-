{% extends "simulator/app_shell.html" %}

{% block title %}FinCoach Helper{% endblock %}

{% block app_content %}
<div class="app-card">
    <div class="section-title">Financial Helper</div>
    <p class="section-subtitle">Get a quick budget check for a purchase, loan, or savings goal.</p>
</div>

<div class="app-card">
    <form id="helper-form" class="form-group">
        <div>
            <label class="label" for="price">Purchase price</label>
            <input id="price" class="input-field" type="number" step="0.01" placeholder="e.g. 1200" />
        </div>
        <div>
            <label class="label" for="down_payment">Down payment</label>
            <input id="down_payment" class="input-field" type="number" step="0.01" placeholder="e.g. 200" />
        </div>
        <div>
            <label class="label" for="rate">Interest rate (%)</label>
            <input id="rate" class="input-field" type="number" step="0.01" placeholder="e.g. 5.5" />
        </div>
        <div>
            <label class="label" for="term_months">Term (months)</label>
            <input id="term_months" class="input-field" type="number" placeholder="e.g. 60" />
        </div>
        <div>
            <label class="label" for="income">Monthly income</label>
            <input id="income" class="input-field" type="number" step="0.01" placeholder="e.g. 3200" />
        </div>
        <div>
            <label class="label" for="commitments">Monthly commitments</label>
            <input id="commitments" class="input-field" type="number" step="0.01" placeholder="e.g. 1500" />
        </div>
        <button type="submit">Check advice</button>
    </form>
</div>

<div class="app-card" id="helper-result-card" style="display: none;">
    <div class="section-title">Advice result</div>
    <p id="helper-verdict" class="section-subtitle"></p>
    <div class="grid-2" style="margin-top: 16px; gap: 14px;">
        <div class="metric-pill">
            <span class="label">Monthly payment</span>
            <span class="value" id="helper-payment">$0</span>
        </div>
        <div class="metric-pill">
            <span class="label">Budget after</span>
            <span class="value" id="helper-budget-after">$0</span>
        </div>
    </div>
</div>

<div class="app-card" id="helper-error-card" style="display: none;">
    <div class="section-title" style="color: #b82f2f;">Unable to calculate</div>
    <p id="helper-error" class="section-subtitle" style="color: #7a3333;"></p>
</div>

<script>
    const helperForm = document.getElementById('helper-form');
    const resultCard = document.getElementById('helper-result-card');
    const verdictText = document.getElementById('helper-verdict');
    const paymentText = document.getElementById('helper-payment');
    const budgetAfterText = document.getElementById('helper-budget-after');
    const errorCard = document.getElementById('helper-error-card');
    const errorText = document.getElementById('helper-error');

    helperForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        resultCard.style.display = 'none';
        errorCard.style.display = 'none';

        const payload = {
            price: Number(document.getElementById('price').value || 0),
            down_payment: Number(document.getElementById('down_payment').value || 0),
            rate: Number(document.getElementById('rate').value || 0),
            term_months: Number(document.getElementById('term_months').value || 60),
            income: Number(document.getElementById('income').value || 0),
            commitments: Number(document.getElementById('commitments').value || 0),
        };

        try {
            const response = await fetch("{% url 'financial_helper:api_advice' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload),
            });
            const data = await response.json();
            if (!response.ok || data.error) {
                throw new Error(data.error || 'Unexpected response');
            }

            verdictText.textContent = data.verdict === 'stretch'
                ? 'This purchase is likely too expensive right now.'
                : data.verdict === 'manageable'
                ? 'This looks manageable, but keep an eye on your obligations.'
                : 'This purchase fits well within your current budget.';
            paymentText.textContent = `$${data.payment.toFixed(2)}`;
            budgetAfterText.textContent = `$${data.budget_after.toFixed(2)}`;
            resultCard.style.display = 'block';
        } catch (err) {
            errorText.textContent = err.message || 'There was a problem with the request.';
            errorCard.style.display = 'block';
        }
    });
</script>
{% endblock %}
